<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACME Talent Hub — API Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #0a0e1a;
            --bg2: #0f1420;
            --bg3: #141928;
            --border: #1e2740;
            --border2: #2a3555;
            --text: #e2e8f8;
            --text2: #7b8ab8;
            --text3: #3d4e72;
            --emp: #22d3a8;
            --emp-dim: #0d4a3c;
            --emp-glow: rgba(34, 211, 168, 0.15);
            --mgr: #818cf8;
            --mgr-dim: #1e1f50;
            --mgr-glow: rgba(129, 140, 248, 0.15);
            --gold: #f59e0b;
            --red: #f87171;
            --green: #4ade80;
            --font-mono: 'JetBrains Mono', monospace;
            --font-display: 'Sora', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 52px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text)
        }

        .logo span {
            color: var(--mgr)
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emp);
            animation: pulse 2s ease-in-out infinite;
            flex-shrink: 0
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 0 0 var(--emp-glow)
            }

            50% {
                opacity: 0.7;
                box-shadow: 0 0 0 5px transparent
            }
        }

        .server-url {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text2);
            background: var(--bg3);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 4px
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .login-form {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .login-form input {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            width: 160px;
            font-family: var(--font-body);
            outline: none;
        }

        .login-form input:focus {
            border-color: var(--border2)
        }

        .btn {
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 5px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover {
            background: var(--bg3)
        }

        .btn-emp {
            border-color: var(--emp);
            color: var(--emp);
            background: transparent
        }

        .btn-emp:hover {
            background: var(--emp-glow)
        }

        .btn-mgr {
            border-color: var(--mgr);
            color: var(--mgr);
            background: transparent
        }

        .btn-mgr:hover {
            background: var(--mgr-glow)
        }

        .btn-sm {
            padding: 3px 10px;
            font-size: 11px
        }

        .token-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            background: var(--bg3);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 4px;
            color: var(--text2);
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .token-badge.active {
            border-color: var(--emp);
            color: var(--emp)
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-section {
            padding: 16px 12px 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text3)
        }

        .ep-group {
            margin-bottom: 4px
        }

        .ep-group-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text2);
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
            transition: background 0.1s;
        }

        .ep-group-title:hover {
            background: var(--bg3);
            color: var(--text)
        }

        .ep-group-title .chevron {
            font-size: 9px;
            transition: transform 0.15s
        }

        .ep-group-title.open .chevron {
            transform: rotate(90deg)
        }

        .ep-list {
            display: none;
            padding: 2px 0
        }

        .ep-list.open {
            display: block
        }

        .ep-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px 5px 18px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text2);
            transition: all 0.1s;
        }

        .ep-item:hover {
            background: var(--bg3);
            color: var(--text)
        }

        .ep-item.active {
            background: rgba(129, 140, 248, 0.08);
            color: var(--mgr)
        }

        .method {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 600;
            padding: 1px 5px;
            border-radius: 3px;
            min-width: 36px;
            text-align: center;
            flex-shrink: 0;
        }

        .GET {
            background: rgba(34, 211, 168, 0.12);
            color: var(--emp)
        }

        .POST {
            background: rgba(251, 191, 36, 0.12);
            color: var(--gold)
        }

        .PUT {
            background: rgba(129, 140, 248, 0.12);
            color: var(--mgr)
        }

        .PATCH {
            background: rgba(251, 146, 60, 0.12);
            color: #fb923c
        }

        .DELETE {
            background: rgba(248, 113, 113, 0.12);
            color: var(--red)
        }

        .panels {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden
        }

        .panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative
        }

        .panel:first-child {
            border-right: 1px solid var(--border)
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 42px;
            border-bottom: 1px solid var(--border);
            background: var(--bg2);
            flex-shrink: 0;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600
        }

        .panel-role-emp {
            color: var(--emp)
        }

        .panel-role-mgr {
            color: var(--mgr)
        }

        .role-pill {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .pill-emp {
            background: var(--emp-dim);
            color: var(--emp)
        }

        .pill-mgr {
            background: var(--mgr-dim);
            color: var(--mgr)
        }

        .panel-actions {
            display: flex;
            gap: 6px;
            align-items: center
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 0
        }

        .log-stream {
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.7;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .log-entry {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            border-left: 2px solid transparent;
            transition: background 0.1s;
            cursor: pointer;
        }

        .log-entry:hover {
            background: rgba(255, 255, 255, 0.03)
        }

        .log-entry.incoming {
            border-left-color: var(--emp)
        }

        .log-entry.error {
            border-left-color: var(--red)
        }

        .log-time {
            color: var(--text3);
            font-size: 10px;
            min-width: 60px;
            padding-top: 1px;
            flex-shrink: 0
        }

        .log-label {
            flex: 1;
            word-break: break-all
        }

        .log-label .method-tag {
            margin-right: 5px
        }

        .log-status {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
            flex-shrink: 0;
            align-self: flex-start;
            margin-top: 1px;
        }

        .s2 {
            background: rgba(74, 222, 128, 0.1);
            color: var(--green)
        }

        .s4 {
            background: rgba(248, 113, 113, 0.1);
            color: var(--red)
        }

        .s5 {
            background: rgba(251, 146, 60, 0.1);
            color: #fb923c
        }

        .detail-pane {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: var(--bg2);
            border-top: 1px solid var(--border);
            display: none;
            flex-direction: column;
            z-index: 5;
        }

        .detail-pane.open {
            display: flex
        }

        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .detail-url {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .detail-close {
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0
        }

        .detail-close:hover {
            color: var(--text)
        }

        .detail-tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .dtab {
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 7px 14px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text3);
            cursor: pointer;
            transition: all 0.1s;
        }

        .dtab:hover {
            color: var(--text2)
        }

        .dtab.active {
            color: var(--emp);
            border-bottom-color: var(--emp)
        }

        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.8
        }

        .json-key {
            color: #7dd3fc
        }

        .json-str {
            color: #86efac
        }

        .json-num {
            color: #fca5a5
        }

        .json-bool {
            color: #fcd34d
        }

        .json-null {
            color: var(--text3)
        }

        .request-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--bg2);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .method-select {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            background: var(--bg3);
            border: 1px solid var(--border2);
            color: var(--gold);
            padding: 5px 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .url-input {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 4px;
            outline: none;
        }

        .url-input:focus {
            border-color: var(--border2)
        }

        .send-btn {
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            background: var(--mgr);
            color: #fff;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .send-btn:hover {
            opacity: 0.85
        }

        .send-btn.emp {
            background: var(--emp);
            color: #0a0e1a
        }

        .stats-strip {
            display: flex;
            gap: 0;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg2);
        }

        .stat-item {
            flex: 1;
            padding: 6px 12px;
            text-align: center;
            border-right: 1px solid var(--border);
            font-size: 10px;
        }

        .stat-item:last-child {
            border-right: none
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: block
        }

        .stat-lbl {
            color: var(--text3);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            color: var(--text3);
        }

        .empty-icon {
            font-size: 32px;
            opacity: 0.4
        }

        .empty-text {
            font-size: 12px;
            font-family: var(--font-mono)
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 2px
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text3)
        }

        .sep {
            width: 1px;
            height: 20px;
            background: var(--border);
            flex-shrink: 0
        }

        .flash {
            animation: flash-in 0.3s ease
        }

        @keyframes flash-in {
            from {
                background: rgba(129, 140, 248, 0.1)
            }

            to {
                background: transparent
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="topbar">
            <div class="topbar-left">
                <div class="live-dot" id="liveDot"></div>
                <div class="logo">ACME <span>API</span> Dashboard</div>
                <div class="sep"></div>
                <div class="server-url" id="serverUrl">http://127.0.0.1:8000</div>
            </div>
            <div class="topbar-right">
                <!-- Login form removed -->
            </div>
        </div>
        <div class="main">
            <div class="sidebar">
                <div class="sidebar-section">Endpoints</div>
                <div id="epList"></div>
            </div>
            <div class="panels">
                <!-- Employee Panel -->
                <div class="panel" id="empPanel">
                    <div class="panel-header">
                        <div class="panel-title panel-role-emp">
                            <span class="role-pill pill-emp">Employee</span>
                            <span id="empPanelTitle">API Log</span>
                        </div>
                        <div class="panel-actions">
                            <button class="btn btn-sm" onclick="clearLog('emp')">Clear</button>
                        </div>
                    </div>
                    <div class="panel-body" id="empLog">
                        <div class="empty-state" id="empEmpty">
                            <div class="empty-icon">⬡</div>
                            <div class="empty-text">No requests yet</div>
                            <div style="font-size:11px;color:var(--text3);font-family:var(--font-mono)">Login and click
                                endpoints to fire requests</div>
                        </div>
                        <div class="log-stream" id="empLogStream" style="display:none"></div>
                    </div>
                    <div class="detail-pane" id="empDetail">
                        <div class="detail-header">
                            <div class="detail-url" id="empDetailUrl"></div>
                            <button class="detail-close" onclick="closeDetail('emp')">✕</button>
                        </div>
                        <div class="detail-tabs">
                            <button class="dtab active" onclick="switchDTab('emp','response')">Response</button>
                            <button class="dtab" onclick="switchDTab('emp','headers')">Headers</button>
                            <button class="dtab" onclick="switchDTab('emp','request')">Request</button>
                        </div>
                        <div class="detail-content" id="empDetailContent"></div>
                    </div>
                    <div class="request-bar">
                        <select class="method-select" id="empMethod">
                            <option>GET</option>
                            <option>POST</option>
                            <option>PUT</option>
                            <option>PATCH</option>
                            <option>DELETE</option>
                        </select>
                        <input class="url-input" id="empUrl" placeholder="/api/employee-dashboard/stats" />
                        <button class="send-btn emp" onclick="fireRequest('emp')">Send ↗</button>
                    </div>
                    <div class="stats-strip">
                        <div class="stat-item"><span class="stat-val" id="empTotal">0</span><span
                                class="stat-lbl">Total</span></div>
                        <div class="stat-item"><span class="stat-val" id="empOk"
                                style="color:var(--green)">0</span><span class="stat-lbl">2xx</span></div>
                        <div class="stat-item"><span class="stat-val" id="empErr" style="color:var(--red)">0</span><span
                                class="stat-lbl">4xx/5xx</span></div>
                        <div class="stat-item"><span class="stat-val" id="empLatency">—</span><span class="stat-lbl">ms
                                avg</span></div>
                    </div>
                </div>
                <!-- Manager Panel -->
                <div class="panel" id="mgrPanel">
                    <div class="panel-header">
                        <div class="panel-title panel-role-mgr">
                            <span class="role-pill pill-mgr">Manager</span>
                            <span id="mgrPanelTitle">API Log</span>
                        </div>
                        <div class="panel-actions">
                            <button class="btn btn-sm" onclick="clearLog('mgr')">Clear</button>
                        </div>
                    </div>
                    <div class="panel-body" id="mgrLog">
                        <div class="empty-state" id="mgrEmpty">
                            <div class="empty-icon">⬡</div>
                            <div class="empty-text">No requests yet</div>
                            <div style="font-size:11px;color:var(--text3);font-family:var(--font-mono)">Login and click
                                endpoints to fire requests</div>
                        </div>
                        <div class="log-stream" id="mgrLogStream" style="display:none"></div>
                    </div>
                    <div class="detail-pane" id="mgrDetail">
                        <div class="detail-header">
                            <div class="detail-url" id="mgrDetailUrl"></div>
                            <button class="detail-close" onclick="closeDetail('mgr')">✕</button>
                        </div>
                        <div class="detail-tabs">
                            <button class="dtab active" onclick="switchDTab('mgr','response')">Response</button>
                            <button class="dtab" onclick="switchDTab('mgr','headers')">Headers</button>
                            <button class="dtab" onclick="switchDTab('mgr','request')">Request</button>
                        </div>
                        <div class="detail-content" id="mgrDetailContent"></div>
                    </div>
                    <div class="request-bar">
                        <select class="method-select" id="mgrMethod">
                            <option>GET</option>
                            <option>POST</option>
                            <option>PUT</option>
                            <option>PATCH</option>
                            <option>DELETE</option>
                        </select>
                        <input class="url-input" id="mgrUrl" placeholder="/api/manager-dashboard/stats" />
                        <button class="send-btn" onclick="fireRequest('mgr')">Send ↗</button>
                    </div>
                    <div class="stats-strip">
                        <div class="stat-item"><span class="stat-val" id="mgrTotal">0</span><span
                                class="stat-lbl">Total</span></div>
                        <div class="stat-item"><span class="stat-val" id="mgrOk"
                                style="color:var(--green)">0</span><span class="stat-lbl">2xx</span></div>
                        <div class="stat-item"><span class="stat-val" id="mgrErr" style="color:var(--red)">0</span><span
                                class="stat-lbl">4xx/5xx</span></div>
                        <div class="stat-item"><span class="stat-val" id="mgrLatency">—</span><span class="stat-lbl">ms
                                avg</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const BASE = 'http://127.0.0.1:8000';
        const state = {
            emp: { token: null, logs: [], stats: { total: 0, ok: 0, err: 0, latencies: [] }, detail: null, activeDTab: 'response' },
            mgr: { token: null, logs: [], stats: { total: 0, ok: 0, err: 0, latencies: [] }, detail: null, activeDTab: 'response' }
        };
        const ENDPOINTS = [
            {
                group: 'Auth', items: [
                    { m: 'POST', path: '/auth/login', label: 'login', who: 'both' },
                    { m: 'POST', path: '/auth/register', label: 'register', who: 'both' },
                    { m: 'POST', path: '/auth/verify-otp', label: 'verify OTP', who: 'both' },
                    { m: 'POST', path: '/auth/forgot-password', label: 'forgot password', who: 'both' },
                    { m: 'POST', path: '/auth/reset-password', label: 'reset password', who: 'both' },
                    { m: 'GET', path: '/auth/me', label: 'me', who: 'both' },
                ]
            },
            {
                group: 'Users', items: [
                    { m: 'GET', path: '/api/users', label: 'list users', who: 'both' },
                    { m: 'GET', path: '/api/users/departments/list', label: 'list departments', who: 'mgr' },
                    { m: 'GET', path: '/api/users/unassigned', label: 'unassigned users', who: 'mgr' },

        function buildSidebar() {
            const el = document.getElementById('epList');
            el.innerHTML = '';
            ENDPOINTS.forEach(group => {
                const gDiv = document.createElement('div');
                gDiv.className = 'ep-group';
                const title = document.createElement('div');
                title.className = 'ep-group-title';
                title.innerHTML = `<span>${group.group}</span><span class="chevron">▶</span>`;
                const list = document.createElement('div');
                list.className = 'ep-list';
                title.onclick = () => { title.classList.toggle('open'); list.classList.toggle('open'); };
                group.items.forEach(ep => {
                    const item = document.createElement('div');
                    item.className = 'ep-item';
                    item.innerHTML = `<span class="method ${ep.m}">${ep.m}</span><span>${ep.label}</span>`;
                    item.onclick = () => clickEndpoint(ep);
                    list.appendChild(item);
                });
                gDiv.appendChild(title);
                gDiv.appendChild(list);
                el.appendChild(gDiv);
            });
        }
        function clickEndpoint(ep) {
            if (ep.who === 'emp' || ep.who === 'both') {
                document.getElementById('empMethod').value = ep.m;
                document.getElementById('empUrl').value = ep.path;
            }
            if (ep.who === 'mgr' || ep.who === 'both') {
                document.getElementById('mgrMethod').value = ep.m;
                document.getElementById('mgrUrl').value = ep.path;
            }
        }
        async function doLogin(role) {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if (!email || !pass) { alert('Enter email and password'); return; }
            const body = new URLSearchParams({ username: email, password: pass });
            const t0 = performance.now();
            try {
                const res = await fetch(`${BASE}/auth/login`, { method: 'POST', body });
                const ms = Math.round(performance.now() - t0);
                const json = await res.json();
                addLog(role, { method: 'POST', url: '/auth/login', status: res.status, ms, response: json, request: { email }, headers: headersObj(res.headers) });
                if (res.ok && json.access_token) {
                    state[role].token = json.access_token;
                    const badge = document.getElementById(role + 'TokenBadge');
                    badge.textContent = json.access_token.substring(0, 28) + '…';
                    badge.classList.add('active');
                    badge.title = json.access_token;
                    document.getElementById('liveDot').style.background = 'var(--green)';
                }
            } catch (e) {
                addLog(role, { method: 'POST', url: '/auth/login', status: 0, ms: 0, response: { error: e.message }, request: {} });
            }
        }
        function copyToken(role) {
            if (state[role].token) {
                navigator.clipboard.writeText(state[role].token);
                const b = document.getElementById(role + 'TokenBadge');
                const orig = b.textContent;
                b.textContent = 'copied!';
                setTimeout(() => b.textContent = orig, 800);
            }
        }
        async function fireRequest(role) {
            const method = document.getElementById(role + 'Method').value;
            const url = document.getElementById(role + 'Url').value.trim();
            if (!url) return;
            const headers = { 'Content-Type': 'application/json' };
            if (state[role].token) headers['Authorization'] = 'Bearer ' + state[role].token;
            let body = undefined;
            if (['POST', 'PUT', 'PATCH'].includes(method)) {
                const bodyStr = prompt(`Request body JSON for ${method} ${url}:`, '{}');
                if (bodyStr === null) return;
                body = bodyStr;
            }
            const t0 = performance.now();
            try {
                const res = await fetch(BASE + url, { method, headers, body });
                const ms = Math.round(performance.now() - t0);
                let json;
                try { json = await res.json(); } catch { json = { raw: await res.text() }; }
                addLog(role, { method, url, status: res.status, ms, response: json, request: body ? JSON.parse(body || '{}') : null, headers: headersObj(res.headers) });
            } catch (e) {
                addLog(role, { method, url, status: 0, ms: 0, response: { error: e.message }, request: null });
            }
        }
        function headersObj(h) { const o = {}; h.forEach((v, k) => o[k] = v); return o; }
        function addLog(role, entry) {
            state[role].logs.unshift(entry);
            const s = state[role].stats;
            s.total++;
            if (entry.status >= 200 && entry.status < 300) s.ok++;
            else if (entry.status >= 400 || entry.status === 0) s.err++;
            if (entry.ms > 0) s.latencies.push(entry.ms);
            updateStats(role);
            renderLog(role);
        }
        function updateStats(role) {
            const s = state[role].stats;
            document.getElementById(role + 'Total').textContent = s.total;
            document.getElementById(role + 'Ok').textContent = s.ok;
            document.getElementById(role + 'Err').textContent = s.err;
            const avg = s.latencies.length ? Math.round(s.latencies.reduce((a, b) => a + b, 0) / s.latencies.length) : 0;
            document.getElementById(role + 'Latency').textContent = avg ? avg + 'ms' : '—';
        }
        function renderLog(role) {
            const stream = document.getElementById(role + 'LogStream');
            const empty = document.getElementById(role + 'Empty');
            empty.style.display = 'none';
            stream.style.display = 'flex';
            stream.innerHTML = '';
            state[role].logs.forEach(entry => {
                const div = document.createElement('div');
                const sc = entry.status;
                div.className = `log-entry ${sc === 0 || sc >= 400 ? 'error' : 'incoming'} flash`;
                div.onclick = () => openDetail(role, entry);
                const statusClass = sc >= 500 ? 's5' : sc >= 400 ? 's4' : 's2';
                div.innerHTML = `
      <span class="log-time">${new Date().toTimeString().substring(0, 8)}</span>
      <span class="log-label">
        <span class="method method-tag ${entry.method}">${entry.method}</span>
        <span style="color:var(--text)">${entry.url}</span>
        ${entry.ms ? `<span style="color:var(--text3);font-size:10px;margin-left:8px">${entry.ms}ms</span>` : ''}
      </span>
      <span class="log-status ${statusClass}">${sc === 0 ? 'ERR' : sc}</span>`;
                stream.appendChild(div);
            });
            document.getElementById(role + 'Log').scrollTop = 0;
        }
        function openDetail(role, entry) {
            state[role].detail = entry;
            document.getElementById(role + 'Detail').classList.add('open');
            document.getElementById(role + 'DetailUrl').textContent = `${entry.method} ${entry.url} — ${entry.status || 'ERR'}`;
            renderDetailContent(role);
        }
        function closeDetail(role) {
            document.getElementById(role + 'Detail').classList.remove('open');
            state[role].detail = null;
        }
        function switchDTab(role, tab) {
            state[role].activeDTab = tab;
            const pane = document.getElementById(role + 'Detail');
            pane.querySelectorAll('.dtab').forEach(t => t.classList.remove('active'));
            pane.querySelectorAll('.dtab').forEach(t => { if (t.textContent.toLowerCase().includes(tab)) t.classList.add('active'); });
            renderDetailContent(role);
        }
        function renderDetailContent(role) {
            const entry = state[role].detail;
            const tab = state[role].activeDTab;
            const el = document.getElementById(role + 'DetailContent');
            if (!entry) return;
            const data = tab === 'response' ? entry.response : tab === 'headers' ? entry.headers : entry.request || { note: 'No body (GET/DELETE)' };
            el.innerHTML = JSON.stringify(data, null, 2)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
                    let c = 'json-num';
                    if (/^"/.test(m)) c = /:$/.test(m) ? 'json-key' : 'json-str';
                    else if (/true|false/.test(m)) c = 'json-bool';
                    else if (/null/.test(m)) c = 'json-null';
                    return `<span class="${c}">${m}</span>`;
                });
        }
        function clearLog(role) {
            state[role].logs = [];
            state[role].stats = { total: 0, ok: 0, err: 0, latencies: [] };
            updateStats(role);
            document.getElementById(role + 'LogStream').innerHTML = '';
            document.getElementById(role + 'LogStream').style.display = 'none';
            document.getElementById(role + 'Empty').style.display = 'flex';
            closeDetail(role);
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (document.activeElement.id === 'empUrl') fireRequest('emp');
                if (document.activeElement.id === 'mgrUrl') fireRequest('mgr');
            }
        });
        buildSidebar();
        (async () => {
            try {
                const r = await fetch(`${BASE}/health`);
                if (r.ok) { document.getElementById('liveDot').style.background = 'var(--green)'; document.getElementById('serverUrl').style.color = 'var(--green)'; }
            } catch { document.getElementById('liveDot').style.background = 'var(--red)'; document.getElementById('serverUrl').style.color = 'var(--red)'; }
        })();

        // WebSockets for Live Logs
        const wsUrl = BASE.replace(/^http/, 'ws') + '/ws';
        const ws = new WebSocket(wsUrl);
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'api_log') {
                    // Send manager requests to manager panel, others to employee panel
                    const role = data.role_hint || 'emp';
                    addLog(role, data);
                } else if (data === 'update') {
                    // Database commit broadcast
                    console.log('Database updated');
                }
            } catch (e) {
                console.error('WS Error:', e);
            }
        };
